# Pinned by digest: a tag can move, a digest cannot, and cosign signs the digest.
# This is the app image the images workflow built and signed on main at 8b06d3f
# (21 Nov 2026). Bump it to deploy a newer build; verify it first with the
# cosign command in SECURITY.md.
image:
  repository: ghcr.io/neel09apr/dwellwise-app
  digest: sha256:872e47e90627030de96ac3328e70ccfb434d6442eccce2009f152dd521446ae1
  tag: "" # used only when digest is empty (CI's locally built image)
  pullPolicy: IfNotPresent

replicaCount: 1

# An existing Secret with DATABASE_URL and (optional) METRICS_TOKEN keys.
# The chart never creates or templates secret values.
existingSecret: dwellwise

containerPort: 8000

service:
  port: 80

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

networkPolicy:
  enabled: true
  # Postgres (Supabase session pooler and direct) is outside the cluster.
  databasePorts: [5432, 6543]
