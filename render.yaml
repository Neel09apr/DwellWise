# Render blueprint: the app as one Docker web service on the free plan.
services:
  - type: web
    name: dwellwise
    runtime: docker
    plan: free
    region: frankfurt # nearest Render region to Ireland
    dockerfilePath: ./app/Dockerfile
    dockerContext: ./app
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL # Supabase session pooler string, set in the dashboard
        sync: false
      - key: METRICS_TOKEN # scrapers send "Authorization: Bearer <token>"
        generateValue: true
      - key: SENTRY_DSN # error tracking; off when unset
        sync: false
      - key: AI_API_KEY # Groq free tier; the assistant (/v1/ask) is off when unset
        sync: false
      - key: AI_ENABLED # kill switch: "false" turns the assistant off
        value: "true"
