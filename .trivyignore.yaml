# Reviewed exceptions only. Each one is scoped to the files it applies to and
# says why, so the same finding elsewhere still fails the build.
misconfigurations:
  - id: DS-0026
    paths:
      - "pipeline/Dockerfile"
    statement: >-
      No HEALTHCHECK in the pipeline image. It is a batch job: the nightly
      workflow starts one container per run, which exits when done, and the
      exit code is the health signal. Long-running containers must still
      define one.
