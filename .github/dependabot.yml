version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /pipeline
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /pipeline
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /app/api
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /app/web
    schedule:
      interval: weekly
    groups:
      web:
        patterns: ["*"]
    ignore:
      # openapi-typescript (generates the API types) supports TypeScript 5 only;
      # TypeScript 7 broke the whole group in Nov 2026. Lift once it supports 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directories:
      - /terraform/bootstrap
      - /terraform/stacks/*
      - /terraform/modules/*
    schedule:
      interval: weekly
