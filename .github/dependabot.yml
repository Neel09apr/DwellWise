version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /pipeline
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /pipeline
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /app/api
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /app/web
    schedule:
      interval: weekly
    groups:
      web:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directories:
      - /terraform/bootstrap
      - /terraform/stacks/*
      - /terraform/modules/*
    schedule:
      interval: weekly
