name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default; jobs that need more ask for it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Terraform fmt, validate, lint
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs; Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.5"
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -check -recursive -diff terraform

      - name: Validate every root and module
        run: |
          set -euo pipefail
          for dir in terraform/bootstrap terraform/stacks/*/ terraform/modules/*/; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2

      - name: TFLint
        working-directory: terraform
        env:
          GITHUB_TOKEN: ${{ github.token }} # avoids rate limits when fetching the AWS ruleset
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl"

  pipeline:
    name: Pipeline lint, test, image build
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:17-3.5
        env:
          # Throwaway test database inside the runner; no password needed.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: pipeline
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .

      - name: Tests, including the database tests against PostGIS
        run: pytest -q -rs

      - name: Build the Lambda image
        run: docker build -t dwellwise-pipeline:ci .

      - name: Smoke-test the image as its non-root user
        run: |
          set -euo pipefail
          # The base image ships the Lambda runtime interface emulator on port 8080.
          docker run -d --name fn -p 9000:8080 dwellwise-pipeline:ci
          for _ in $(seq 1 20); do
            out=$(curl -s -X POST localhost:9000/2015-03-31/functions/function/invocations               -d '{"sources": ["no-such-source"]}' || true)
            [ -n "$out" ] && break
            sleep 1
          done
          echo "$out"
          docker exec fn id -u | grep -qx 65532
          # The handler imported, ran and rejected the unknown source by name.
          echo "$out" | grep -q "unknown sources"
          docker rm -f fn

  app:
    name: App API, web and image
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_HOST_AUTH_METHOD: trust # throwaway test database inside the runner
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/api/requirements-dev.txt

      - name: API lint and tests, including PostGIS
        working-directory: app/api
        run: |
          pip install -r requirements-dev.txt
          ruff check .
          ruff format --check .
          pytest -q -rs
          python -m dwellwise_api.export_openapi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/web/package-lock.json

      - name: Web typecheck, tests and build
        working-directory: app/web
        run: |
          npm ci --no-audit --no-fund
          npm run gen:api
          npm run typecheck
          npm test
          npm run build

      # The web client is generated from the API schema; both must be committed.
      - name: API contract is up to date
        run: git diff --exit-code -- app/api/openapi.json app/web/src/api/schema.d.ts

      - name: Build and smoke-test the app image
        run: |
          set -euo pipefail
          docker build -t dwellwise-app:ci app
          docker run -d --name app -p 8000:8000 dwellwise-app:ci
          for _ in $(seq 1 20); do curl -fsS localhost:8000/health && break; sleep 1; done
          [ "$(docker exec app id -u)" = "10001" ]
          curl -fsS localhost:8000/ | grep -q '<div id="root">'
          curl -fsS localhost:8000/settlements/123 | grep -q '<div id="root">'
          [ "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/ready)" = "503" ]
          docker rm -f app

  trivy:
    name: Trivy IaC scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload findings to GitHub code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan for the Security tab (all severities)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          trivyignores: .trivyignore.yaml
          format: sarif
          output: trivy.sarif
          exit-code: "0"

      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy-iac

      - name: Fail on HIGH or CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          trivyignores: .trivyignore.yaml
          severity: HIGH,CRITICAL
          exit-code: "1"
          skip-setup-trivy: true

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the whole history, not just the tip
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: false
