name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default; jobs that need more ask for it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Terraform fmt, validate, lint
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs; Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.5"
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -check -recursive -diff terraform

      - name: Validate every root and module
        run: |
          set -euo pipefail
          for dir in terraform/bootstrap terraform/stacks/*/ terraform/modules/*/; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2

      - name: TFLint
        working-directory: terraform
        env:
          GITHUB_TOKEN: ${{ github.token }} # avoids rate limits when fetching the AWS ruleset
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl"

  pipeline:
    name: Pipeline lint, test, image build
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:17-3.5
        env:
          # Throwaway test database inside the runner; no password needed.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: pipeline
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15" # match the container images
          cache: pip
          cache-dependency-path: pipeline/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .

      - name: Tests, including the database tests against PostGIS
        run: pytest -q -rs

      - name: Build the pipeline image
        run: docker build -t dwellwise-pipeline:ci .

      - name: Smoke-test the image as its non-root user
        run: |
          set -euo pipefail
          docker run --rm --entrypoint id dwellwise-pipeline:ci -u | grep -qx 65532
          # The CLI starts, lists every source, and rejects an unknown one by name.
          docker run --rm dwellwise-pipeline:ci run --help | grep -q planning
          ! out=$(docker run --rm dwellwise-pipeline:ci run no-such-source 2>&1)
          echo "$out" | grep -q "invalid choice"
          # Prune runs against an empty local store without credentials.
          docker run --rm dwellwise-pipeline:ci prune | grep -q '"pruned": 0'

  app:
    name: App API, web and image
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_HOST_AUTH_METHOD: trust # throwaway test database inside the runner
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15" # match the container images
          cache: pip
          cache-dependency-path: app/api/requirements-dev.txt

      - name: API lint and tests, including PostGIS
        working-directory: app/api
        run: |
          pip install -r requirements-dev.txt
          ruff check .
          ruff format --check .
          pytest -q -rs
          python -m dwellwise_api.export_openapi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26" # match the image build stage
          cache: npm
          cache-dependency-path: app/web/package-lock.json

      - name: Uptime probe lint and tests
        working-directory: .
        run: |
          ruff check ops
          ruff format --check ops
          python -m pytest -q ops

      - name: Web typecheck, tests and build
        working-directory: app/web
        run: |
          npm ci --no-audit --no-fund
          npm run gen:api
          npm run typecheck
          npm test
          npm run build

      # The web client is generated from the API schema; both must be committed.
      - name: API contract is up to date
        run: git diff --exit-code -- app/api/openapi.json app/web/src/api/schema.d.ts

      - name: Build and smoke-test the app image
        run: |
          set -euo pipefail
          docker build -t dwellwise-app:ci app
          docker run -d --name app -p 8000:8000 dwellwise-app:ci
          for _ in $(seq 1 20); do curl -fsS localhost:8000/health && break; sleep 1; done
          [ "$(docker exec app id -u)" = "10001" ]
          curl -fsS localhost:8000/ | grep -q '<div id="root">'
          curl -fsS localhost:8000/settlements/123 | grep -q '<div id="root">'
          [ "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/ready)" = "503" ]
          docker rm -f app

  floci:
    name: AWS Terraform on the Floci emulator
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      floci:
        image: floci/floci:2.4.0 # AWS emulator (MIT); throwaway, inside the runner
        ports: ["4566:4566"]
    env:
      # Emulator placeholders, not credentials: Floci accepts any non-empty value.
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: eu-west-1
      AWS_ENDPOINT_URL: http://localhost:4566 # the AWS CLI in check.sh
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_alert_email: alerts@example.invalid
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.5"
          terraform_wrapper: false

      - name: Wait for Floci, point the AWS roots at it
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do aws sts get-caller-identity > /dev/null 2>&1 && break; sleep 1; done
          aws sts get-caller-identity
          for dir in terraform/bootstrap terraform/stacks/data; do cp .github/floci/floci_override.tf "$dir/"; done

      - name: Apply the bootstrap (state bucket, OIDC roles, boundary, budget)
        run: |
          terraform -chdir=terraform/bootstrap init
          terraform -chdir=terraform/bootstrap apply -auto-approve -no-color

      - name: Apply the data stack, its state in the bootstrap bucket with S3-native locking
        run: |
          set -euo pipefail
          bucket=$(terraform -chdir=terraform/bootstrap output -raw state_bucket)
          echo "STATE_BUCKET=$bucket" >> "$GITHUB_ENV"
          terraform -chdir=terraform/stacks/data init \
            -backend-config="bucket=$bucket" -backend-config="key=data/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" -backend-config="use_lockfile=true" \
            -backend-config='endpoints={s3="http://localhost:4566"}' -backend-config="use_path_style=true" \
            -backend-config="skip_credentials_validation=true" -backend-config="skip_requesting_account_id=true"
          terraform -chdir=terraform/stacks/data apply -auto-approve -no-color

      - name: A second plan changes nothing
        run: |
          set -euo pipefail
          for dir in terraform/bootstrap terraform/stacks/data; do
            terraform -chdir="$dir" plan -detailed-exitcode -no-color > "$RUNNER_TEMP/plan.txt" \
              || { cat "$RUNNER_TEMP/plan.txt"; echo "::error::$dir does not converge"; exit 1; }
            echo "$dir: no changes"
          done

      - name: Check the controls on what was built
        run: |
          .github/floci/check.sh "$STATE_BUCKET" \
            "$(terraform -chdir=terraform/stacks/data output -raw snapshots_bucket)"

  kubernetes:
    name: Helm chart on a throwaway kind cluster
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHART: deploy/helm/dwellwise
      NS: dwellwise
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1

      - name: Lint the chart
        run: helm lint --strict "$CHART"

      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          version: v0.33.0
          cluster_name: dwellwise

      - name: Build the app image and load it into the cluster
        run: |
          docker build -t dwellwise-app:ci app
          kind load docker-image dwellwise-app:ci --name dwellwise

      # The namespace rejects any pod that breaks the "restricted" Pod Security profile.
      - name: Namespace enforcing Pod Security "restricted"
        run: |
          set -euo pipefail
          kubectl create namespace "$NS"
          kubectl label namespace "$NS" pod-security.kubernetes.io/enforce=restricted pod-security.kubernetes.io/warn=restricted
          # Placeholder metrics token; no DATABASE_URL, so /ready reports 503 by design.
          kubectl -n "$NS" create secret generic dwellwise --from-literal=METRICS_TOKEN=ci-placeholder

      - name: Install
        run: |
          helm install dwellwise "$CHART" -n "$NS" --wait --timeout 4m \
            --set image.repository=dwellwise-app --set image.tag=ci --set image.pullPolicy=Never

      - name: helm test (smoke check from inside the cluster)
        run: helm test dwellwise -n "$NS" --logs

      - name: Check the running pod
        run: |
          set -euo pipefail
          pod=$(kubectl -n "$NS" get pod -l app.kubernetes.io/name=dwellwise -o jsonpath='{.items[0].metadata.name}')
          [ "$(kubectl -n "$NS" exec "$pod" -- id -u)" = "10001" ]
          # Read-only root filesystem. (A bare "! cmd" would never fail the step under set -e.)
          if kubectl -n "$NS" exec "$pod" -- touch /srv/x 2>/dev/null; then echo "::error::root filesystem is writable"; exit 1; fi
          kubectl -n "$NS" port-forward svc/dwellwise 8080:80 > /dev/null &
          for _ in $(seq 1 20); do curl -fsS localhost:8080/health && break; sleep 1; done
          echo
          curl -fsS localhost:8080/ | grep -q '<div id="root">'
          [ "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/ready)" = "503" ]
          echo "pod $pod: uid 10001, read-only root, web app served, /ready 503 without a database"

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n "$NS" get all,networkpolicy,events -o wide || true
          kubectl -n "$NS" describe pods || true
          kubectl -n "$NS" logs -l app.kubernetes.io/name=dwellwise --tail=100 || true

  trivy:
    name: Trivy IaC scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload findings to GitHub code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan for the Security tab (all severities)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          trivyignores: .trivyignore.yaml
          format: sarif
          output: trivy.sarif
          exit-code: "0"

      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy-iac

      - name: Fail on HIGH or CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          trivyignores: .trivyignore.yaml
          severity: HIGH,CRITICAL
          exit-code: "1"
          skip-setup-trivy: true

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the whole history, not just the tip
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: false
