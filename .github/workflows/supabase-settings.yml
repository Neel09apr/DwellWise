# The Supabase project's security settings as code: plan on pull request and
# weekly (drift), apply on merge. Secrets live in the "supabase-settings"
# environment; until it is configured the workflow only prints a notice, so pull
# requests are never blocked by it.
name: supabase settings

on:
  pull_request:
    paths: ["terraform/stacks/supabase/**", ".github/workflows/supabase-settings.yml"]
  push:
    branches: [main]
    paths: ["terraform/stacks/supabase/**", ".github/workflows/supabase-settings.yml"]
  schedule:
    - cron: "47 5 * * 1" # Mondays: a plan that shows drift from dashboard changes
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-settings
  cancel-in-progress: false # never cancel a run that may hold the state lock

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  STACK_DIR: terraform/stacks/supabase
  APPLY: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}

jobs:
  terraform:
    name: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && 'Apply' || 'Plan' }} Supabase settings
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: supabase-settings
    env:
      # A scoped access token: this project only, 90-day expiry, write access
      # only to SSL enforcement and auth config, nothing to SQL or secrets.
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Is Supabase configured?
        id: ready
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          missing=""
          for name in SUPABASE_ACCESS_TOKEN DATABASE_URL; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::notice title=Supabase settings not configured::Missing in the supabase-settings environment:$missing"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.ready.outputs.ok == 'true'
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: steps.ready.outputs.ok == 'true'
        with:
          terraform_version: "1.15.5"
          terraform_wrapper: false

      - name: State connection
        if: steps.ready.outputs.ok == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          # Percent-encode a raw password (it may contain @), as the app does; mask the result.
          conn=$(python3 ops/dburl.py)
          echo "::add-mask::$conn"
          echo "PG_CONN_STR=$conn" >> "$GITHUB_ENV"

      - name: Init
        if: steps.ready.outputs.ok == 'true'
        run: terraform -chdir="$STACK_DIR" init

      - name: Plan
        if: steps.ready.outputs.ok == 'true' && env.APPLY != 'true'
        run: terraform -chdir="$STACK_DIR" plan -lock-timeout=2m -no-color

      - name: Apply
        if: steps.ready.outputs.ok == 'true' && env.APPLY == 'true'
        run: terraform -chdir="$STACK_DIR" apply -auto-approve -lock-timeout=2m -no-color
