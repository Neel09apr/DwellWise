name: terraform

on:
  pull_request:
    paths: ["terraform/**", ".github/workflows/terraform.yml"]
  push:
    branches: [main]
    paths: ["terraform/**", ".github/workflows/terraform.yml"]
  schedule:
    - cron: "0 6 * * 1" # weekly drift check, Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false # never cancel a run that may hold the state lock

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  STACK_DIR: terraform/stacks/data
  STATE_KEY: data/terraform.tfstate
  # Repository variables set after bootstrap. Identifiers, not secrets.
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}

jobs:
  # Until the AWS account is bootstrapped there are no roles to assume.
  not-bootstrapped:
    if: vars.AWS_PLAN_ROLE_ARN == ''
    runs-on: ubuntu-latest
    steps:
      - run: echo "::notice title=AWS not bootstrapped::Set the repository variables from README 'Bootstrap' to enable plan and apply."

  plan:
    if: vars.AWS_PLAN_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for the read-only plan role
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.5"
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          role-session-name: gha-plan-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Init
        run: >
          terraform -chdir="$STACK_DIR" init
          -backend-config="bucket=$TF_STATE_BUCKET"
          -backend-config="key=$STATE_KEY"
          -backend-config="region=$AWS_REGION"
          -backend-config="encrypt=true"
          -backend-config="use_lockfile=true"

      - name: Plan
        run: |
          set +e
          terraform -chdir="$STACK_DIR" plan -lock-timeout=2m -detailed-exitcode -no-color > plan.txt 2>&1
          code=$?
          set -e
          {
            echo "### Terraform plan: data stack"
            echo '```'
            tail -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat plan.txt
          # 0 = no changes, 1 = error, 2 = changes pending.
          if [ "$code" -eq 1 ]; then exit 1; fi
          if [ "$code" -eq 2 ] && [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            echo "::error title=Drift detected::Live AWS no longer matches main. See the plan in the run summary."
            exit 1
          fi

  apply:
    needs: plan
    if: >
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.AWS_APPLY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    # Required reviewers on this environment are the approval gate, and the
    # apply role trusts only tokens issued for this environment.
    environment: production
    concurrency:
      group: terraform-apply
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.5"
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          role-session-name: gha-apply-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Init
        run: >
          terraform -chdir="$STACK_DIR" init
          -backend-config="bucket=$TF_STATE_BUCKET"
          -backend-config="key=$STATE_KEY"
          -backend-config="region=$AWS_REGION"
          -backend-config="encrypt=true"
          -backend-config="use_lockfile=true"

      # Re-plan inside this job and apply exactly that plan, rather than passing
      # a plan file between jobs: plan files can hold resource attributes, and
      # workflow artifacts on a public repository are downloadable.
      - name: Plan
        run: terraform -chdir="$STACK_DIR" plan -lock-timeout=2m -no-color -out=tfplan

      - name: Apply
        run: terraform -chdir="$STACK_DIR" apply -lock-timeout=2m -no-color tfplan
